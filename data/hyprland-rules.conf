# Hyprland Window Rules for X Desktop Client

# Main application window (tiled by default)
windowrulev2 = tile, class:^(x-desktop)$, title:^(X.*)$

# Floating Picture-in-Picture window pinned in the corner
windowrulev2 = float, class:^(x-desktop)$, title:^(X Picture in Picture)$
windowrulev2 = pin, class:^(x-desktop)$, title:^(X Picture in Picture)$
windowrulev2 = size 480 270, class:^(x-desktop)$, title:^(X Picture in Picture)$
windowrulev2 = move 100%-504 100%-294, class:^(x-desktop)$, title:^(X Picture in Picture)$
windowrulev2 = nodim, class:^(x-desktop)$, title:^(X Picture in Picture)$
windowrulev2 = keepaspectratio, class:^(x-desktop)$, title:^(X Picture in Picture)$
